# Keeps the free Supabase project from pausing (it pauses after 7 days of low
# database activity): once a day, calls the keepalive() database function
# (supabase/migrations/0001_sync.sql), which only updates one timestamp.
# A failed run (project paused, key changed) makes GitHub email the owner.
# Note: GitHub switches scheduled workflows off after 60 days without commits
# in a public repository — re-enable it in the Actions tab if that happens.
# Setup: documentation/SUPABASE_SETUP.md, part 4.
name: Supabase keep-alive

on:
  schedule:
    - cron: '23 11 * * *'   # every day at 11:23 UTC (08:23 in Brasília)
  workflow_dispatch:         # "Run workflow" button, for testing

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Touch the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
